<!DOCTYPE html>
<html lang="es">

  
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficciones Futuras — Consigna</title>

<style>
  * { 
    box-sizing: border-box;
  } 
  html { 
    scroll-behavior: smooth;
  }
  body {
      margin: 0;
      background: #f5f5f2;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 18px;
      line-height: 1.45;
    }

    main {
      width: min(1100px, calc(100% - 80px));
      margin: 0 auto;
      padding: 70px 0 120px;
    }

    header {
      margin-bottom: 150px;
    }

    .title {
      font-size: clamp(48px, 9vw, 120px);
      line-height: 0.9;
      font-weight: 700;
      letter-spacing: -0.065em;
      margin: 0;
    }

    .subtitle {
      margin-top: 35px;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
.subtitle a {
  color: inherit;
  text-decoration: none;
  margin-right: 35px;
}

.subtitle a:hover {
  text-decoration: underline;
}
    .consigna {
      max-width: 850px;
    }

    .consigna p {
      margin: 0 0 28px;
    }

    .consigna p:first-child {
      font-size: clamp(27px, 3.4vw, 46px);
      line-height: 1.08;
      letter-spacing: -0.035em;
      margin-bottom: 75px;
    }
  </style>
</head>

<body>

  <h1>Consigna</h1>

  <!-- acá va la consigna -->

</body>

</html>
