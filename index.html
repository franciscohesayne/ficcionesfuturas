<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficciones Futuras</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      /* Fondo celeste base */
      background-color: #39c6f3;
      
      min-height: 100vh;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      
      /* Centra los elementos globalmente */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    /* CONTENEDOR DEL VIDEO DE FONDO */
    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -1;
    }

    /* Contenedor desplazado en vertical y corrido a la derecha */
    .hero-content {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      
      margin-top: 0px; 
      margin-left: 0px; 
    }

    /* Subtítulo institucional (Inicialmente oculto hasta que termine el video) */
    .welcome-subtitle {
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 25px;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.4);
      margin-left: 10px;
      
      /* Propiedades para la aparición gradual */
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease;
    }

    /* Contenedor que agrupa el botón y las flechas para moverlos juntos o controlar su aparición */
    .enter-container {
      display: flex;
      align-items: center;
      gap: 15px; /* Espacio entre el botón y las flechas */
      margin-left: 10px;

      /* Propiedades para la aparición gradual */
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease;
    }

    /* Estilo del botón ENTRAR */
    .enter-btn {
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 12px 35px;
      border: none;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.08);
      transition: background 0.3s ease, color 0.3s ease;
    }

    .enter-btn:hover {
      background: #fff;
      color: #39c6f3;
    }

    /* Estilo de las flechitas estilo Instagram / Carrusel */
    .carousel-arrows {
      display: flex;
      gap: 8px;
    }
    
    .arrow {
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      text-decoration: none;
      opacity: 0.7;
      transition: opacity 0.2s ease, transform 0.2s ease;
      text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.4);
    }

    .arrow:hover {
      opacity: 1;
      transform: scale(1.15);
    }

    /* Clase que se activa mediante JavaScript al terminar el video */
    .show-elements {
      opacity: 1 !important;
      visibility: visible !important;
    }
  </style>
</head>
<body>

  <!-- VIDEO DE FONDO: 
       NOTA SOBRE EL SONIDO: Si querés que tenga audio, borrale la palabra 'muted'. 
       (Ojo: Google Chrome y otros navegadores a veces bloquean el sonido automático si el usuario no hizo clic antes en la página). -->
  <video id="introVideo" class="bg-video" autoplay playsinline>
    <source src="VIDEO/Video Project12.mp4" type="video/mp4">
    Tu navegador no soporta videos HTML5.
  </video>

  <!-- Bloque con desplazamiento vertical y horizontal exacto -->
  <div class="hero-content">
    <div id="welcomeSubtitle" class="welcome-subtitle">FADU · UBA · 2026</div>
    
    <!-- Contenedor agrupado para el botón y las flechitas -->
    <div id="enterContainer" class="enter-container">
      <a href="inicio.html" class="enter-btn">ENTRAR</a>
      <div class="carousel-arrows">
        <a href="inicio.html" class="arrow">‹</a>
        <a href="inicio.html" class="arrow">›</a>
      </div>
    </div>
  </div>

  <!-- SCRIPT PARA MOSTRAR LOS ELEMENTOS AL FINALIZAR EL VIDEO -->
  <script>
    const video = document.getElementById('introVideo');
    const subtitle = document.getElementById('welcomeSubtitle');
    const container = document.getElementById('enterContainer');

    // Detecta el momento exacto en que termina el video
    video.addEventListener('ended', function() {
      subtitle.classList.add('show-elements');
      container.classList.add('show-elements');
    });
  </script>

</body>
</html>
