<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficciones Futuras</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background-color: #39c6f3;
      min-height: 100vh;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      overflow: hidden;
    }

    /* CONTENEDOR DEL VIDEO DE FONDO */
    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -1;
    }

    /* BLOQUE CENTRAL (ENTRAR Y SUBTÍTULO) */
    .hero-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      justify-content: center;
      position: relative;
    }

    /* Subtítulo institucional (Oculto hasta terminar el video) */
    .welcome-subtitle {
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 25px;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.4);
      
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease;
    }

    /* Estilo del botón ENTRAR (Oculto hasta terminar el video) */
    .enter-btn {
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 12px 35px;
      border: none;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.15);
      
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease, background 0.3s ease, color 0.3s ease;
    }

    .enter-btn:hover {
      background: #fff;
      color: #39c6f3;
    }

    /* Clase general que activa la aparición al terminar el video */
    .show-elements {
      opacity: 1 !important;
      visibility: hidden; /* se sobrescribe con visible abajo */
      visibility: visible !important;
    }

    /* ==========================================================
       FLECHITAS LATERALES (CONTROL MILIMÉTRICO DE POSICIÓN)
       ========================================================== */
    .arrow-left, .arrow-right {
      position: fixed;
      top: 50%; /* <--- CAMBIÁ ESTO SI QUERÉS SUBIRLAS O BAJARLAS (ej: 48%, 52%) */
      transform: translateY(-50%);
      font-size: clamp(40px, 7vw, 80px); /* <--- TAMAÑO DE LAS FLECHAS */
      font-weight: bold;
      color: #ffe00b;
      text-decoration: none;
      text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
      z-index: 10;

      /* Inicialmente ocultas hasta que termine el video */
      opacity: 0;
      visibility: hidden;
      transition: transform 0.2s ease, opacity 0.8s ease;
    }

    .arrow-left {
      left: 28vw; /* <--- ACÁ LAS MOVÉS DE IZQUIERDA A DERECHA (ej: 4vw, 8vw, o en px: "80px") */
    }

    .arrow-right {
      right: 28vw; /* <--- ACÁ LAS MOVÉS DE DERECHA A IZQUIERDA (ej: 4vw, 8vw, o en px: "80px") */
    }

    .arrow-left:hover, .arrow-right:hover {
      transform: translateY(-50%) scale(1.15);
    }
  </style>
</head>
<body>

  <!-- VIDEO DE FONDO CON SONIDO -->
  <video id="introVideo" class="bg-video" autoplay playsinline>
    <source src="VIDEO/Video Project18.mp4" type="video/mp4">
    Tu navegador no soporta videos HTML5.
  </video>

  <!-- FLECHITA IZQUIERDA -->
  <a href="inicio.html" id="arrowLeft" class="arrow-left">‹</a>

  <!-- BLOQUE CENTRAL -->
  <div class="hero-content">
    <div id="welcomeSubtitle" class="welcome-subtitle">FADU · UBA · 2026</div>
    <a href="inicio.html" id="enterBtn" class="enter-btn">ENTRAR</a>
  </div>

  <!-- FLECHITA DERECHA -->
  <a href="inicio.html" id="arrowRight" class="arrow-right">›</a>

  <!-- SCRIPT PARA SINCRONIZAR AUDIO Y APARICIÓN AL FINALIZAR EL VIDEO -->
  <script>
    const video = document.getElementById('introVideo');
    const subtitle = document.getElementById('welcomeSubtitle');
    const btn = document.getElementById('enterBtn');
    const arrowLeft = document.getElementById('arrowLeft');
    const arrowRight = document.getElementById('arrowRight');

    // Intentar reproducir con sonido
    video.muted = false;
    video.play().catch(() => {
      video.muted = true;
      video.play();
    });

    // Evento al terminar los 13 segundos del video
    video.addEventListener('ended', function() {
      subtitle.classList.add('show-elements');
      btn.classList.add('show-elements');
      arrowLeft.classList.add('show-elements');
      arrowRight.classList.add('show-elements');
    });
  </script>

</body>
</html>
