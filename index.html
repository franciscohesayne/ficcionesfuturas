<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficciones Futuras</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      /* Fondo celeste base */
      background-color: #39c6f3;
      /* La imagen ocupa todo el ancho y alto de la pantalla */
      background-image: url('IMAGENES/FICCIONES-c.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      
      min-height: 100vh;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      
      /* Centra los elementos globalmente */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    /* Contenedor desplazado en vertical y corrido a la derecha */
    .hero-content {
      display: flex;
      flex-direction: column;
      align-items: flex-start; /* Alinea los elementos a la izquierda dentro de su bloque */
      text-align: left;
      
      /* Mantiene la posición vertical exacta que logramos */
      margin-top: 130px; 
      
      /* Mueve el bloque hacia la derecha para alinearlo con el final de 'Ficciones' */
      margin-left: 65px; 
    }

    /* Subtítulo institucional */
    .welcome-subtitle {
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 25px;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.4);
    }

    /* Estilo del botón ENTRAR */
    .enter-btn {
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 12px 35px;
      border: 2px solid #fff;
      border-radius: 4px;
      transition: all 0.3s ease;
      background: rgba(0, 0, 0, 0.15);
    }
    .enter-btn:hover {
      background: #fff;
      color: #39c6f3;
    }
  </style>
</head>
<body>

  <!-- Bloque con desplazamiento vertical y horizontal exacto -->
  <div class="hero-content">
    <div class="welcome-subtitle">FADU · UBA · 2026</div>
    <a href="index.html" class="enter-btn">ENTRAR</a>
  </div>

</body>
</html>
