<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficciones Futuras</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background-color: #39c6f3;
      min-height: 100vh;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      overflow: hidden;
    }

    /* CONTENEDOR DEL VIDEO DE FONDO */
    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -1;
    }

    /* ==========================================================
       CONTENEDOR DE LAS IMÁGENES PNG (Por delante del video)
       ========================================================== */
    .image-viewer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none; /* Para que no bloquee clics por detrás si hiciera falta */
      z-index: 5;

      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease;
    }

    .gallery-img {
      max-width: 65vw;
      max-height: 65vh;
      object-fit: contain;
      /* Opcional: un toque de sombra para que resalten sobre el video */
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
    }

    /* BLOQUE CENTRAL (ENTRAR Y SUBTÍTULO) */
    .hero-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      justify-content: center;
      position: relative;
      z-index: 20;
    }

    /* Subtítulo institucional (Oculto hasta terminar el video) */
    .welcome-subtitle {
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 25px;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.4);
      
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease;
    }

    /* Estilo del botón ENTRAR (Oculto hasta terminar el video) */
    .enter-btn {
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 12px 35px;
      border: none;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.15);
      
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease, background 0.3s ease, color 0.3s ease;
    }

    .enter-btn:hover {
      background: #fff;
      color: #39c6f3;
    }

    /* Clase general que activa la aparición al terminar el video */
    .show-elements {
      opacity: 1 !important;
      visibility: visible !important;
    }

    /* ==========================================================
       FLECHITAS LATERALES (BOTONES DEL CARRUSEL)
       ========================================================== */
    .arrow-left, .arrow-right {
      position: fixed;
      top: 49%; 
      transform: translateY(-50%);

      /* Tamaño del círculo */
      width: 65px;  
      height: 65px; 
      border-radius: 50%;

      /* Misma transparencia exacta que el botón ENTRAR (0.15) */
      background: rgba(0, 0, 0, 0.15); 
      border: 1px solid rgba(255, 255, 255, 0.2); 
      
      /* Centra perfectamente la flecha adentro del círculo */
      display: flex;
      justify-content: center;
      align-items: center;
      
      font-size: 28px; 
      font-weight: bold;
      color: #ffe00b;
      text-decoration: none;
      cursor: pointer;
      z-index: 30;

      /* Inicialmente ocultas hasta que termine el video */
      opacity: 0;
      visibility: hidden;
      transition: transform 0.2s ease, opacity 0.8s ease, background 0.2s ease;
    }

    .arrow-left {
      left: 28vw; 
    }

    .arrow-right {
      right: 28vw; 
    }

    .arrow-left:hover, .arrow-right:hover {
      transform: translateY(-50%) scale(1.1);
      background: rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body>

  <!-- VIDEO DE FONDO CON SONIDO -->
  <video id="introVideo" class="bg-video" autoplay playsinline>
    <source src="VIDEO/Video Project21.mp4" type="video/mp4">
    Tu navegador no soporta videos HTML5.
  </video>

  <!-- CONTENEDOR DE LA IMAGEN PNG ACTUAL -->
  <div id="imageViewer" class="image-viewer">
    <img id="currentImage" class="gallery-img" src="" alt="Ficciones Futuras">
  </div>

  <!-- FLECHITA IZQUIERDA (BOTÓN) -->
  <button id="arrowLeft" class="arrow-left">‹</button>

  <!-- BLOQUE CENTRAL -->
  <div class="hero-content">
    <div id="welcomeSubtitle" class="welcome-subtitle">FADU · UBA · 2026</div>
    <a href="inicio.html" id="enterBtn" class="enter-btn">ENTRAR</a>
  </div>

  <!-- FLECHITA DERECHA (BOTÓN) -->
  <button id="arrowRight" class="arrow-right">›</button>

  <!-- SCRIPT PARA AUDIO, FIN DEL VIDEO Y CAMBIO DE IMÁGENES -->
  <script>
    const video = document.getElementById('introVideo');
    const subtitle = document.getElementById('welcomeSubtitle');
    const btn = document.getElementById('enterBtn');
    const arrowLeft = document.getElementById('arrowLeft');
    const arrowRight = document.getElementById('arrowRight');
    const imageViewer = document.getElementById('imageViewer');
    const currentImage = document.getElementById('currentImage');

    // Lista con tus dos imágenes PNG especificadas
    const images = [
      "IMAGENES/FICCIONES/FF01-1.png",
      "IMAGENES/FICCIONES/FF02-1.png"
    ];

    let currentIndex = 0;

    function updateImage() {
      currentImage.src = images[currentIndex];
    }

    // Intentar reproducir con sonido
    video.muted = false;
    let playPromise = video.play();

    if (playPromise !== undefined) {
      playPromise.catch(() => {
        video.muted = true;
        video.play();
        
        const enableAudioOnInteraction = function() {
          video.muted = false;
          window.removeEventListener('click', enableAudioOnInteraction);
          window.removeEventListener('touchstart', enableAudioOnInteraction);
        };
        
        window.addEventListener('click', enableAudioOnInteraction);
        window.addEventListener('touchstart', enableAudioOnInteraction);
      });
    }

    // Evento al terminar los 13 segundos del video
    video.addEventListener('ended', function() {
      subtitle.classList.add('show-elements');
      btn.classList.add('show-elements');
      arrowLeft.classList.add('show-elements');
      arrowRight.classList.add('show-elements');
      imageViewer.classList.add('show-elements');
      
      updateImage(); // Carga la primera imagen (FF01-1.png) al finalizar el video
    });

    // Lógica para cambiar de imagen con la flecha derecha
    arrowRight.addEventListener('click', function() {
      currentIndex = (currentIndex + 1) % images.length;
      updateImage();
    });

    // Lógica para cambiar de imagen con la flecha izquierda
    arrowLeft.addEventListener('click', function() {
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      updateImage();
    });
  </script>

</body>
</html>
