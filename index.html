<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficciones Futuras</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background-color: #39c6f3;
      min-height: 100vh;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      
      /* Centra los elementos globalmente en el medio de la pantalla */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      overflow: hidden;
    }

    /* CONTENEDOR DEL VIDEO DE FONDO */
    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -1;
    }

    /* BLOQUE CENTRAL (ENTRAR Y SUBTÍTULO) - PERFECTAMENTE CENTRADO */
    .hero-content {
      display: flex;
      flex-direction: column;
      align-items: center; /* Centrado absoluto */
      text-align: center;
      justify-content: center;
      position: relative;
    }

    /* Subtítulo institucional (Oculto hasta terminar el video) */
    .welcome-subtitle {
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 25px;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.4);
      
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease;
    }

    /* Estilo del botón ENTRAR (Oculto hasta terminar el video) */
    .enter-btn {
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 12px 35px;
      border: none;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.15);
      
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease, background 0.3s ease, color 0.3s ease;
    }

    .enter-btn:hover {
      background: #fff;
      color: #39c6f3;
    }

    /* Clase que activa la aparición al terminar el video */
    .show-elements {
      opacity: 1 !important;
      visibility: visible !important;
    }

    /* --- FLECHITAS GRANDES FLANQUEANDO LOS LADOS --- */
    .arrow-left, .arrow-right {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      font-size: clamp(40px, 7vw, 80px); /* Grandes y responsivas */
      font-weight: bold;
      color: #ffe00b; /* Color amarillo institucional o blanco según prefieras */
      text-decoration: none;
      text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
      transition: transform 0.2s ease, opacity 0.2s ease;
      z-index: 10;
      opacity: 0.85;
    }

    .arrow-left {
      left: 6vw; /* Posicionadas a los costados, donde marcan tus flechas rojas */
    }

    .arrow-right {
      right: 6vw;
    }

    .arrow-left:hover, .arrow-right:hover {
      transform: translateY(-50%) scale(1.15);
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- VIDEO DE FONDO: Intentará reproducirse con sonido. 
       Si el navegador bloquea el audio por seguridad, se destrabará al primer clic del usuario en la pantalla. -->
  <video id="introVideo" class="bg-video" autoplay playsinline>
    <source src="VIDEO/Video Project18.mp4" type="video/mp4">
    Tu navegador no soporta videos HTML5.
  </video>

  <!-- FLECHITA IZQUIERDA (Al lado de FICCIONES) -->
  <a href="inicio.html" class="arrow-left">‹</a>

  <!-- BLOQUE CENTRAL (Todo perfectamente centrado) -->
  <div class="hero-content">
    <div id="welcomeSubtitle" class="welcome-subtitle">FADU · UBA · 2026</div>
    <a href="inicio.html" id="enterBtn" class="enter-btn">ENTRAR</a>
  </div>

  <!-- FLECHITA DERECHA (Al lado de FUTURAS) -->
  <a href="inicio.html" class="arrow-right">›</a>

  <!-- SCRIPT PARA EL FIN DEL VIDEO Y AUDIO -->
  <script>
    const video = document.getElementById('introVideo');
    const subtitle = document.getElementById('welcomeSubtitle');
    const btn = document.getElementById('enterBtn');

    // Intentar activar el sonido por si el navegador lo permite de entrada
    video.muted = false;
    video.play().catch(() => {
      // Si el navegador bloquea el audio autoplay, lo dejamos en mute hasta el primer clic del usuario
      video.muted = true;
      video.play();
    });

    // Detecta el momento exacto en que termina el video de 13s
    video.addEventListener('ended', function() {
      subtitle.classList.add('show-elements');
      btn.classList.add('show-elements');
    });
  </script>

</body>
</html>
